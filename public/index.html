<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fergus 3P — My Goals</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f4f8; min-height: 100vh; }

    header {
      background: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    header h1 { font-size: 1.2rem; color: #1a202c; }
    header span { color: #718096; font-size: 0.9rem; }
    button.logout {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #4a5568;
    }
    button.logout:hover { background: #f7fafc; }

    main { max-width: 680px; margin: 40px auto; padding: 0 16px; }

    .week-label {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .add-goal {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }
    .add-goal input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-goal input:focus { border-color: #667eea; }
    .add-goal button {
      padding: 12px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .add-goal button:hover { background: #5a67d8; }

    .goals-list { list-style: none; }
    .goal-item {
      background: white;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: opacity 0.2s;
    }
    .goal-item.done { opacity: 0.5; }
    .goal-item.done .goal-text { text-decoration: line-through; }

    .goal-item input[type="checkbox"] {
      width: 20px; height: 20px;
      accent-color: #667eea;
      cursor: pointer;
      flex-shrink: 0;
    }
    .goal-text { flex: 1; font-size: 1rem; color: #2d3748; }
    .delete-btn {
      background: none;
      border: none;
      color: #cbd5e0;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .delete-btn:hover { color: #e53e3e; }

    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 40px 0;
      font-size: 0.95rem;
    }

    .progress-bar-wrap {
      background: #e2e8f0;
      border-radius: 99px;
      height: 8px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #667eea;
      border-radius: 99px;
      transition: width 0.4s ease;
    }
    .progress-label { font-size: 0.85rem; color: #718096; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Fergus 3P — Weekly Goals</h1>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="userLabel"></span>
      <button class="logout" onclick="logout()">Log out</button>
    </div>
  </header>

  <main>
    <div class="week-label" id="weekLabel"></div>

    <div class="add-goal">
      <input type="text" id="newGoal" placeholder="Add a new goal for this week..." />
      <button onclick="addGoal()">+ Add</button>
    </div>

    <div class="progress-label" id="progressLabel"></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>

    <ul class="goals-list" id="goalsList"></ul>
    <div class="empty" id="emptyMsg" style="display:none">No goals yet — add one above!</div>
  </main>

  <script>
    let goals = [];

    async function init() {
      const res = await fetch("/api/me");
      if (!res.ok) { window.location.href = "/login"; return; }
      const user = await res.json();
      document.getElementById("userLabel").textContent = user.username;

      const weekStart = getWeekStart();
      document.getElementById("weekLabel").textContent =
        "Week of " + weekStart.toLocaleDateString("en-IE", { day: "numeric", month: "long", year: "numeric" });

      await loadGoals();
    }

    async function loadGoals() {
      const res = await fetch("/api/goals");
      goals = await res.json();
      renderGoals();
    }

    function renderGoals() {
      const list = document.getElementById("goalsList");
      const empty = document.getElementById("emptyMsg");
      list.innerHTML = "";

      if (goals.length === 0) {
        empty.style.display = "block";
        updateProgress(0, 0);
        return;
      }
      empty.style.display = "none";

      goals.forEach((goal, i) => {
        const li = document.createElement("li");
        li.className = "goal-item" + (goal.done ? " done" : "");
        li.innerHTML = `
          <input type="checkbox" ${goal.done ? "checked" : ""} onchange="toggleGoal(${i})" />
          <span class="goal-text">${escapeHtml(goal.text)}</span>
          <button class="delete-btn" onclick="deleteGoal(${i})" title="Delete">×</button>
        `;
        list.appendChild(li);
      });

      const done = goals.filter(g => g.done).length;
      updateProgress(done, goals.length);
    }

    function updateProgress(done, total) {
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById("progressBar").style.width = pct + "%";
      document.getElementById("progressLabel").textContent =
        total === 0 ? "" : `${done} of ${total} goals complete (${pct}%)`;
    }

    async function addGoal() {
      const input = document.getElementById("newGoal");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      await fetch("/api/goals", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      await loadGoals();
    }

    async function toggleGoal(index) {
      await fetch(`/api/goals/${index}/toggle`, { method: "POST" });
      await loadGoals();
    }

    async function deleteGoal(index) {
      await fetch(`/api/goals/${index}`, { method: "DELETE" });
      await loadGoals();
    }

    async function logout() {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login";
    }

    document.getElementById("newGoal").addEventListener("keydown", (e) => {
      if (e.key === "Enter") addGoal();
    });

    function getWeekStart() {
      const d = new Date();
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    init();
  </script>
</body>
</html>
